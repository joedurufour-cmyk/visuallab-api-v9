services:
  - type: web
    name: visuallab-api-v9
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GROQ_API_KEY
        sync: false
      - key: API_SECRET
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
